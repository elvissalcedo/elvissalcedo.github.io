  <header class="site-header">
    <div class="inner">
      <h1>Elvis Salcedo | Ingeniería Ambiental</h1>
      <p class="tagline">Agua, aire, suelo y residuos, explicados con rigor técnico.</p>
      <nav class="site-nav">
        <ul>
          <li><a href="/"{% if page.url == "/" %} class="selected"{% endif %}>Inicio</a></li>
          {% for cat in site.categorias %}
          <li><a href="/categorias/{{ cat.slug }}.html"{% if page.category == cat.name or page.categoria_slug == cat.slug %} class="selected"{% endif %}>{{ cat.name }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </header>
